<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Informasi — SD Negeri 2 Karangmangu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
        /* -- token system --------------------------------------------- */
        --ink:        #1E2A44;   /* deep navy — authority, teacher */
        --ink-soft:    #4A5776;
        --paper:      #FAF6EC;   /* warm cream board */
        --paper-line: #E7DFC9;   /* hairline on cream */
        --card:       #FFFFFF;
        --gold:       #C7862B;   /* marigold — headmaster / achievement */
        --gold-soft:  #F3E2C2;
        --teal:       #2C7A72;   /* operator / school ops */
        --teal-soft:  #D7E9E5;
        --rose:       #B4512E;   /* parent voice, warm terracotta-rose */
        --rose-soft:  #F0DCCF;
        --danger:     #B23A2E;

        --font-display: 'Fraunces', Georgia, serif;
        --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        --radius: 14px;
        --shadow-card: 0 1px 2px rgba(30,42,68,0.06), 0 8px 20px -12px rgba(30,42,68,0.18);
        --shadow-pop: 0 20px 50px -12px rgba(30,42,68,0.35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font-body);
        background: var(--paper);
        color: var(--ink);
        background-image:
            radial-gradient(circle at 1px 1px, rgba(30,42,68,0.06) 1px, transparent 0);
        background-size: 22px 22px;
    }

    /* ---------------- Header: "papan informasi" banner ---------------- */
    .header {
        background: linear-gradient(135deg, var(--ink) 0%, #2A3A5E 100%);
        color: white;
        padding: 18px 16px;
        box-shadow: 0 4px 16px rgba(30,42,68,0.25);
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
        border-bottom: 3px solid var(--gold);
    }

    .header-content {
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
    }

    .header-eyebrow {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gold-soft);
        opacity: 0.85;
        margin-bottom: 2px;
    }

    .header-title {
        font-family: var(--font-display);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.01em;
    }

    .class-info {
        font-size: 13px;
        opacity: 0.8;
        margin-top: 2px;
    }

    .teacher-btn {
        background: var(--gold);
        color: var(--ink);
        padding: 10px 18px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
        font-family: var(--font-body);
        transition: transform 0.15s ease, background 0.15s ease;
        white-space: nowrap;
        box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }

    .teacher-btn:hover {
        background: #D89B3F;
        transform: translateY(-1px);
    }

    .teacher-btn:active { transform: translateY(0px); }

    .container {
        max-width: 800px;
        margin: 96px auto 40px;
        padding: 20px;
    }

    /* ---------------- Post card: pinned notice ---------------- */
    .post-card {
        background: var(--card);
        border-radius: var(--radius);
        margin-bottom: 22px;
        box-shadow: var(--shadow-card);
        overflow: hidden;
        border: 1px solid var(--paper-line);
        position: relative;
    }

    /* colored spine on the left, keyed to role — set per avatar class below */
    .post-card::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 4px;
        background: var(--ink-soft);
    }
    .post-card:has(.avatar.teacher)::before    { background: var(--ink); }
    .post-card:has(.avatar.headmaster)::before { background: var(--gold); }
    .post-card:has(.avatar.operator)::before   { background: var(--teal); }

    .post-header {
        display: flex;
        align-items: center;
        padding: 18px 18px 14px 22px;
        gap: 13px;
    }

    .avatar {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-family: var(--font-display);
        font-size: 17px;
        flex-shrink: 0;
    }

    .avatar.teacher    { background: var(--ink); }
    .avatar.headmaster { background: var(--gold); }
    .avatar.operator   { background: var(--teal); }
    .avatar.parent     { background: var(--rose); border-radius: 50%; }

    .post-info { flex: 1; min-width: 0; }

    .post-author {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 16px;
        color: var(--ink);
        margin-bottom: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .post-role {
        color: var(--ink-soft);
        font-size: 12.5px;
        font-weight: 600;
    }

    .post-time {
        color: #8A93AB;
        font-size: 12px;
        font-family: var(--font-mono);
        margin-top: 1px;
    }

    .post-content { padding: 4px 22px 20px; font-size: 15px; line-height: 1.65; }

    /* subject tag styled like an official stamp / seal */
    .post-subject {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--paper);
        color: var(--ink);
        padding: 5px 14px 5px 10px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 700;
        margin-bottom: 14px;
        border: 1.5px dashed var(--gold);
    }

    .comments-section {
        border-top: 1px dashed var(--paper-line);
        padding: 16px 18px;
        background: #FCFAF3;
    }

    .comments-count {
        color: var(--ink-soft);
        font-size: 13px;
        margin-bottom: 12px;
        font-weight: 700;
        font-family: var(--font-mono);
        letter-spacing: 0.02em;
    }

    .comment {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        padding: 12px 14px;
        background: var(--card);
        border-radius: 10px;
        border: 1px solid var(--paper-line);
        position: relative;
    }

    .comment:hover .delete-btn { opacity: 1; }

    .delete-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: var(--danger);
        color: white;
        border: none;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        cursor: pointer;
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.2s, background 0.2s;
    }

    .delete-btn:hover { background: #8f2c22; }

    .post-delete-btn {
        background: transparent;
        color: rgba(255,255,255,0.55);
        border: 1.5px solid rgba(255,255,255,0);
        border-radius: 50%;
        width: 34px;
        height: 34px;
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, color 0.2s;
        flex-shrink: 0;
    }
    .post-header .post-delete-btn { color: #C7CEDD; }
    .post-header .post-delete-btn:hover { background: var(--rose-soft); color: var(--danger); }

    .comment-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 13px;
        flex-shrink: 0;
        font-family: var(--font-display);
    }

    .comment-content { flex: 1; min-width: 0; }

    .comment-author { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; color: var(--ink); }

    .comment-text { font-size: 14px; line-height: 1.5; color: #333c50; word-wrap: break-word; }

    .comment-time { color: #9199AD; font-size: 11px; margin-top: 4px; font-family: var(--font-mono); }

    .add-comment { display: flex; gap: 10px; margin-top: 14px; }

    .add-comment input {
        flex: 1;
        padding: 11px 16px;
        border-radius: 999px;
        border: 1.5px solid var(--paper-line);
        font-size: 14px;
        font-family: var(--font-body);
        background: var(--card);
        cursor: pointer;
    }

    .add-comment input:focus { outline: none; border-color: var(--teal); }

    .add-comment button {
        padding: 11px 20px;
        background: var(--ink);
        color: white;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
        transition: background 0.2s;
        white-space: nowrap;
    }

    .add-comment button:hover { background: #2A3A5E; }

    /* ---------------- Modals ---------------- */
    .modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(20,26,42,0.55);
        backdrop-filter: blur(2px);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        overflow-y: auto;
    }

    .modal.active { display: flex; }

    .modal-content {
        background: var(--card);
        padding: 26px;
        border-radius: 18px;
        width: 90%;
        max-width: 500px;
        box-shadow: var(--shadow-pop);
        margin: 20px;
        border-top: 4px solid var(--gold);
    }

    .modal-title {
        font-family: var(--font-display);
        font-size: 19px;
        font-weight: 600;
        margin-bottom: 18px;
        color: var(--ink);
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 700;
        font-size: 13px;
        color: var(--ink-soft);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 11px 13px;
        border: 1.5px solid var(--paper-line);
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        background: #FDFCF8;
        color: var(--ink);
    }

    .form-group input:disabled { background-color: #F0EEE6; cursor: not-allowed; color: #A6A6A6; }

    .form-group textarea { min-height: 120px; resize: vertical; }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { outline: none; border-color: var(--teal); background: white; }

    .subject-options { display: flex; gap: 8px; flex-wrap: wrap; }

    .subject-option {
        padding: 8px 15px;
        border: 1.5px solid var(--paper-line);
        border-radius: 999px;
        cursor: pointer;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink-soft);
        transition: all 0.15s;
    }

    .subject-option:hover { border-color: var(--teal); background: var(--teal-soft); }

    .subject-option.active { border-color: var(--ink); background: var(--ink); color: white; }

    .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }

    .modal-buttons button {
        padding: 11px 20px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
        font-family: var(--font-body);
    }

    .btn-cancel { background: #EFEBDF; color: var(--ink-soft); }
    .btn-cancel:hover { background: #E5E0D0; }

    .btn-submit { background: var(--ink); color: white; }
    .btn-submit:hover { background: #2A3A5E; }

    @media (max-width: 768px) {
        .container { padding: 10px; margin-top: 128px; }

        .header-content { flex-direction: column; align-items: stretch; text-align: center; gap: 10px; }

        .teacher-btn { width: 100%; padding: 13px 20px; font-size: 15px; }

        .post-card { margin-bottom: 16px; }

        .post-header { padding: 14px 14px 12px 18px; gap: 10px; }

        .avatar { width: 40px; height: 40px; font-size: 15px; }

        .post-author { font-size: 15px; }

        .post-role, .post-time { font-size: 11.5px; }

        .post-delete-btn { width: 36px; height: 36px; font-size: 15px; }

        .post-content { padding: 4px 16px 16px; font-size: 14px; }

        .comments-section { padding: 14px; }

        .comment { padding: 10px 12px; gap: 8px; }

        .comment-avatar { width: 30px; height: 30px; font-size: 11.5px; }

        .comment-author { font-size: 13px; }

        .comment-text { font-size: 13px; }

        .comment-time { font-size: 10.5px; }

        .delete-btn { width: 26px; height: 26px; font-size: 13px; top: 5px; right: 5px; }

        .add-comment { gap: 8px; }

        .add-comment input { font-size: 16px; padding: 12px 16px; }

        .add-comment button { padding: 12px 22px; font-size: 15px; }

        .modal { align-items: flex-start; padding: 40px 0; }

        .modal-content { width: 95%; padding: 20px; }

        .form-group input, .form-group select, .form-group textarea { font-size: 16px; padding: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
    }
  </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div>
                <div class="header-eyebrow">Papan Informasi Digital</div>
                <div class="header-title">Portal Komunikasi Sekolah</div>
                <div class="class-info">SD Negeri 2 Karangmangu</div>
            </div>
            <button class="teacher-btn" onclick="openAnnouncementModal()">✏️ Buat Pengumuman</button>
        </div>
    </div>

    <div class="container">

        <div class="modal" id="announcementModal">
            <div class="modal-content">
                <div class="modal-title">📌 Pengumuman Baru</div>
                
                <div id="passwordForm">
                    <div class="form-group">
                        <label>Password Guru</label>
                        <input type="password" id="teacherPassword" placeholder="Masukkan password guru">
                    </div>
                    <div class="modal-buttons">
                        <button class="btn-cancel" onclick="closeAnnouncementModal()">Batal</button>
                        <button class="btn-submit" onclick="verifyPassword()">Verifikasi</button>
                    </div>
                </div>

                <div id="announcementForm" style="display: none;">
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input type="text" id="teacherName" placeholder="Contoh: Bu Hesti Wijayanti">
                    </div>
                    <div class="form-group">
                        <label>Peran</label>
                        <select id="teacherRole" onchange="toggleClassInput()">
                            <option value="">-- Pilih Peran --</option>
                            <option value="Wali Kelas">Wali Kelas</option>
                            <option value="Kepala Sekolah">Kepala Sekolah</option>
                            <option value="Operator Sekolah">Operator Sekolah</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Kelas (Jika Wali Kelas)</label>
                        <input type="text" id="teacherClass" placeholder="Contoh: 5A" disabled>
                    </div>
                    <div class="form-group">
                        <label>Kategori Pengumuman</label>
                        <div class="subject-options">
                            <div class="subject-option" onclick="selectSubject(this, '📖 Pengumuman Penting')">📖 Pengumuman</div>
                            <div class="subject-option" onclick="selectSubject(this, '📝 Tugas')">📝 Tugas</div>
                            <div class="subject-option" onclick="selectSubject(this, '⚽ Kegiatan')">⚽ Kegiatan</div>
                            <div class="subject-option" onclick="selectSubject(this, '📚 Materi Pelajaran')">📚 Materi</div>
                            <div class="subject-option" onclick="selectSubject(this, '🎉 Acara')">🎉 Acara</div>
                        </div>
                        <input type="hidden" id="selectedSubject">
                    </div>
                    <div class="form-group">
                        <label>Isi Pengumuman</label>
                        <textarea id="announcementContent" placeholder="Tulis pengumuman Anda di sini..."></textarea>
                    </div>
                    <div class="modal-buttons">
                        <button class="btn-cancel" onclick="closeAnnouncementModal()">Batal</button>
                        <button class="btn-submit" onclick="submitAnnouncement()">Posting Pengumuman</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal" id="commentModal">
            <div class="modal-content">
                <div class="modal-title">💬 Tulis Komentar</div>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="userName" placeholder="Contoh: Ibu Siti">
                </div>
                <div class="form-group">
                    <label>Sebagai Orang Tua Dari</label>
                    <input type="text" id="studentName" placeholder="Contoh: Ahmad">
                </div>
                <div class="form-group">
                    <label>Komentar</label>
                    <input type="text" id="userComment" placeholder="Tulis komentar Anda...">
                </div>
                <div class="modal-buttons">
                    <button class="btn-cancel" onclick="closeModal()">Batal</button>
                    <button class="btn-submit" onclick="submitComment()">Kirim Komentar</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // GANTI dengan URL Web App hasil deploy Code.gs (Deploy > New deployment > Web app).
// URL di bawah ini contoh lama — pastikan diganti dengan URL deployment terbaru kamu.
const API_URL = "https://script.google.com/macros/s/AKfycby1OmJdgQ8EYlqnQ2KM91SCsjb6V34sqnLar0PpOQMe4gla0oixblSBbx9GjeioQFFa/exec";

let currentPostId = null;
let selectedSubjectText = '';
const TEACHER_PASSWORD = 'guru123';

// FIX 1: DOMContentLoaded dibuat async dan pemanggilannya di-await berurutan,
// supaya komentar dimuat SETELAH post/pengumuman selesai dibuat di DOM.
// Sebelumnya loadAnnouncements() dan loadComments() dipanggil bersamaan tanpa
// menunggu (tanpa await), sehingga sering terjadi race condition: loadComments()
// mencari elemen post-card yang belum ada, akibatnya komentar gagal muncul saat
// pertama kali halaman dibuka.
window.addEventListener('DOMContentLoaded', async function() {
    await loadAnnouncements();
    await loadComments();
});

// FIX 2: fungsi escapeHtml untuk mencegah celah XSS.
// Sebelumnya semua input pengguna (nama, komentar, isi pengumuman, dst) langsung
// dimasukkan ke innerHTML tanpa disaring. Jika ada orang yang mengetik kode
// HTML/script di kolom nama atau komentar, kode itu akan ikut dieksekusi di
// browser semua pengguna lain yang membuka halaman. Sekarang semua teks dari
// pengguna di-escape dulu sebelum ditampilkan.
function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

async function fetchData(sheet, action = null, postId = null) {
    try {
        let url = `${API_URL}?sheet=${sheet}`;
        if (action) url += `&action=${action}`;
        if (postId) url += `&postId=${postId}`;

        // FIX 4 (CORS): jangan set header 'Content-Type' di request GET.
        // Menambahkan header itu membuat browser menganggap ini request
        // "tidak sederhana" dan mengirim OPTIONS (preflight) dulu sebelum
        // GET yang sebenarnya. Apps Script tidak bisa membalas preflight,
        // jadi browser langsung memblokir seluruh request dengan CORS error
        // — inilah sebabnya data yang SUDAH tersimpan di spreadsheet tetap
        // tidak muncul saat halaman dibuka lagi. GET tanpa header custom
        // otomatis jadi "simple request" dan tidak butuh preflight sama sekali.
        const response = await fetch(url, {
            method: 'GET',
            mode: 'cors'
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            return data.data;
        } else {
            console.error('Error:', data.message);
            return [];
        }
    } catch (error) {
        console.error('Error fetching data:', error);
        return [];
    }
}

async function postData(sheet, action, data) {
    try {
        // FIX 3 (CORS): Content-Type sengaja dibuat 'text/plain' (bukan
        // 'application/json'). Kalau pakai 'application/json', browser akan
        // mengirim permintaan "preflight" (OPTIONS) dulu sebelum POST, dan
        // Google Apps Script Web App TIDAK bisa membalas preflight itu —
        // hasilnya error CORS yang membingungkan meskipun URL & deploy-nya
        // sudah benar. Dengan 'text/plain', browser mengirim POST langsung
        // tanpa preflight, dan backend (Code.gs) tetap bisa mem-parsing isi
        // body-nya sebagai JSON lewat e.postData.contents.
        const response = await fetch(API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify({
                sheet: sheet,
                action: action,
                ...data
            })
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
            return true;
        } else {
            console.error('Error:', result.message);
            return false;
        }
    } catch (error) {
        console.error('Error posting data:', error);
        return false;
    }
}

async function loadAnnouncements() {
    const announcements = await fetchData('pengumuman');
    announcements.forEach(announcement => {
        if (!document.querySelector(`[data-post-id="${announcement.postId}"]`)) {
            addAnnouncementToDOM(announcement.teacherName, announcement.teacherRole, announcement.teacherClass, announcement.subject, announcement.content, announcement.time, announcement.postId);
        }
    });
}

async function loadComments() {
    const comments = await fetchData('komentar');
    
    comments.forEach(comment => {
        const targetPost = document.querySelector(`[data-post-id="${comment.postId}"]`);
        if (targetPost && !document.querySelector(`[data-comment-id="${comment.commentId}"]`)) {
            addCommentToDOM(comment.postId, comment.userName, comment.studentName, comment.userComment, comment.time, comment.color, comment.initials, comment.commentId, false);
        }
    });

    document.querySelectorAll('.post-card').forEach(post => {
        const commentCount = post.querySelectorAll('.comment').length;
        const countElement = post.querySelector('.comments-count');
        if (countElement) {
            countElement.textContent = `💬 ${commentCount} Komentar`;
        }
    });
}

function selectSubject(element, subject) {
    document.querySelectorAll('.subject-option').forEach(opt => {
        opt.classList.remove('active');
    });
    element.classList.add('active');
    selectedSubjectText = subject;
    document.getElementById('selectedSubject').value = subject;
}

function toggleClassInput() {
    const role = document.getElementById('teacherRole').value;
    const classInput = document.getElementById('teacherClass');
    if (role === 'Wali Kelas') {
        classInput.disabled = false;
        classInput.focus();
    } else {
        classInput.disabled = true;
        classInput.value = '';
    }
}

function verifyPassword() {
    const inputPassword = document.getElementById('teacherPassword').value;
    
    if (inputPassword === '') {
        alert('Mohon masukkan password!');
        return;
    }

    if (inputPassword === TEACHER_PASSWORD) {
        document.getElementById('passwordForm').style.display = 'none';
        document.getElementById('announcementForm').style.display = 'block';
        document.getElementById('teacherName').focus();
    } else {
        alert('❌ Password salah! Hanya guru yang bisa membuat pengumuman.');
        document.getElementById('teacherPassword').value = '';
        document.getElementById('teacherPassword').focus();
    }
}

function openAnnouncementModal() {
    document.getElementById('announcementModal').classList.add('active');
    document.getElementById('passwordForm').style.display = 'block';
    document.getElementById('announcementForm').style.display = 'none';
    document.getElementById('teacherPassword').focus();
}

function closeAnnouncementModal() {
    document.getElementById('announcementModal').classList.remove('active');
    document.getElementById('teacherPassword').value = '';
    document.getElementById('teacherName').value = '';
    document.getElementById('teacherRole').value = '';
    document.getElementById('teacherClass').value = '';
    document.getElementById('teacherClass').disabled = true;
    document.getElementById('announcementContent').value = '';
    document.getElementById('selectedSubject').value = '';
    selectedSubjectText = '';
    document.querySelectorAll('.subject-option').forEach(opt => {
        opt.classList.remove('active');
    });
}

async function submitAnnouncement() {
    const teacherName = document.getElementById('teacherName').value.trim();
    const teacherRole = document.getElementById('teacherRole').value;
    const teacherClass = document.getElementById('teacherClass').value.trim();
    const content = document.getElementById('announcementContent').value.trim();
    const subject = document.getElementById('selectedSubject').value;

    if (teacherName === '' || teacherRole === '' || content === '') {
        alert('Mohon lengkapi semua field yang wajib diisi!');
        return;
    }
    
    if (teacherRole === 'Wali Kelas' && teacherClass === '') {
        alert('Mohon isi kelas untuk Wali Kelas!');
        return;
    }

    if (subject === '') {
        alert('Mohon pilih kategori pengumuman!');
        return;
    }

    const postId = 'post_' + Date.now();
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const time = `Hari ini, ${hours}:${minutes}`;

    // Password diambil dari field yang sama dipakai saat verifikasi awal
    // (nilainya masih ada di DOM meski formnya disembunyikan), lalu dikirim
    // ke backend supaya server yang memutuskan valid/tidaknya — bukan hanya
    // JavaScript di browser.
    const teacherPasswordValue = document.getElementById('teacherPassword').value;

    const success = await postData('pengumuman', 'add', {
        postId, teacherName, teacherRole, teacherClass, subject, content, time,
        timestamp: new Date().getTime(), password: teacherPasswordValue
    });
    
    if (success) {
        addAnnouncementToDOM(teacherName, teacherRole, teacherClass, subject, content, time, postId);
        closeAnnouncementModal();

        setTimeout(() => {
            const el = document.querySelector(`[data-post-id="${postId}"]`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    } else {
        alert('Gagal menyimpan pengumuman. Silakan coba lagi.');
    }
}

function addAnnouncementToDOM(teacherName, teacherRole, teacherClass, subject, content, time, postId) {
    const initials = teacherName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
    
    let roleString = teacherRole;
    let avatarClass = 'teacher';
    
    if (teacherRole === 'Kepala Sekolah') {
        roleString = 'Kepala Sekolah';
        avatarClass = 'headmaster';
    } else if (teacherRole === 'Operator Sekolah') {
        roleString = 'Operator Sekolah';
        avatarClass = 'operator';
    } else if (teacherRole === 'Wali Kelas') {
        roleString = `Wali Kelas ${teacherClass}`;
    }

    const newPost = document.createElement('div');
    newPost.className = 'post-card';
    newPost.setAttribute('data-post-id', postId);
    
    // FIX: semua teks dinamis di-escape sebelum masuk ke innerHTML
    newPost.innerHTML = `
        <div class="post-header">
            <div class="avatar ${avatarClass}">${escapeHtml(initials)}</div>
            <div class="post-info">
                <div class="post-author">${escapeHtml(teacherName)}</div>
                <div class="post-role">${escapeHtml(roleString)}</div>
                <div class="post-time">${escapeHtml(time)}</div>
            </div>
            <button class="post-delete-btn" onclick="deletePost('${postId}')" title="Hapus pengumuman">🗑️</button>
        </div>
        <div class="post-content">
            <span class="post-subject">${escapeHtml(subject)}</span>
            <p style="white-space: pre-line;">${escapeHtml(content)}</p>
        </div>
        <div class="comments-section">
            <div class="comments-count">💬 0 Komentar</div>
            <div class="add-comment">
                <div class="comment-avatar parent" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">A</div>
                <input type="text" placeholder="Tulis komentar..." readonly onclick="openModal('${postId}')">
            </div>
        </div>
    `;

    const container = document.querySelector('.container');
    container.insertBefore(newPost, container.firstChild);
}

function openModal(postId) {
    currentPostId = postId;
    document.getElementById('commentModal').classList.add('active');
    document.getElementById('userName').focus();
}

function closeModal() {
    document.getElementById('commentModal').classList.remove('active');
    document.getElementById('userName').value = '';
    document.getElementById('studentName').value = '';
    document.getElementById('userComment').value = '';
    currentPostId = null;
}

function addCommentToDOM(postId, userName, studentName, userComment, time, color, initials, commentId, updateCount = true) {
    const newComment = document.createElement('div');
    newComment.className = 'comment';
    newComment.setAttribute('data-comment-id', commentId);
    
    // FIX: escape semua teks dari pengguna
    newComment.innerHTML = `
        <div class="comment-avatar parent" style="background: ${color};">${escapeHtml(initials)}</div>
        <div class="comment-content">
            <div class="comment-author">${escapeHtml(userName)} (Orang Tua ${escapeHtml(studentName)})</div>
            <div class="comment-text">${escapeHtml(userComment)}</div>
            <div class="comment-time">${escapeHtml(time)}</div>
        </div>
        <button class="delete-btn" onclick="deleteComment(this, '${postId}', '${commentId}')" title="Hapus komentar">✕</button>
    `;

    const targetPost = document.querySelector(`[data-post-id="${postId}"]`);
    if (targetPost) {
        const addCommentForm = targetPost.querySelector('.add-comment');
        const commentsCount = targetPost.querySelector('.comments-count');
        
        if (updateCount) {
            const currentCount = parseInt(commentsCount.textContent.match(/\d+/)[0]);
            commentsCount.textContent = `💬 ${currentCount + 1} Komentar`;
        }
        
        addCommentForm.parentNode.insertBefore(newComment, addCommentForm);
    }

    return newComment;
}

async function deleteComment(buttonElement, postId, commentId) {
    if (!confirm('Apakah Anda yakin ingin menghapus komentar ini?')) {
        return;
    }

    const commentElement = buttonElement.closest('.comment');
    commentElement.remove();

    const targetPost = document.querySelector(`[data-post-id="${postId}"]`);
    if (targetPost) {
        const commentsCount = targetPost.querySelector('.comments-count');
        const currentCount = parseInt(commentsCount.textContent.match(/\d+/)[0]);
        commentsCount.textContent = `💬 ${Math.max(0, currentCount - 1)} Komentar`;
    }

    await postData('komentar', 'delete', { commentId });
}

async function deletePost(postId) {
    const password = prompt('Masukkan password guru untuk menghapus pengumuman:');

    if (!password) {
        return;
    }

    if (!confirm('Apakah Anda yakin ingin menghapus pengumuman ini? Semua komentar juga akan terhapus.')) {
        return;
    }

    // Password dikirim ke backend untuk diverifikasi di server (lihat
    // handleDeletePengumuman_ di Code.gs). Backend juga otomatis menghapus
    // semua komentar yang menempel pada postingan ini, jadi kita tidak
    // perlu lagi memanggil fetchData('komentar', 'getByPostId', ...) di sini.
    const success = await postData('pengumuman', 'delete', { postId, password });

    if (!success) {
        alert('❌ Password salah, atau terjadi kesalahan saat menghapus.');
        return;
    }

    const postElement = document.querySelector(`[data-post-id="${postId}"]`);
    if (postElement) {
        postElement.remove();
    }
}

async function submitComment() {
    const userName = document.getElementById('userName').value.trim();
    const studentName = document.getElementById('studentName').value.trim();
    const userComment = document.getElementById('userComment').value.trim();

    if (userName === '' || studentName === '' || userComment === '') {
        alert('Mohon isi semua field dengan lengkap!');
        return;
    }

    if (!currentPostId) {
        alert('Terjadi kesalahan: postingan tidak ditemukan. Silakan coba lagi.');
        return;
    }

    const now = new Date();
    const time = now.getHours().toString().padStart(2, '0') + ':' + 
                now.getMinutes().toString().padStart(2, '0');

    const initials = userName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
    
    const colors = [
        'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
        'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
        'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
        'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
        'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
    ];
    const randomColor = colors[Math.floor(Math.random() * colors.length)];
    
    const commentId = 'comment_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    
    const success = await postData('komentar', 'add', {
        commentId, postId: currentPostId, userName, studentName, userComment, time, 
        color: randomColor, initials, timestamp: new Date().getTime()
    });
    
    if (success) {
        const newComment = addCommentToDOM(currentPostId, userName, studentName, userComment, time, randomColor, initials, commentId, true);
        closeModal();

        setTimeout(() => {
            newComment.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    } else {
        alert('Gagal menyimpan komentar. Silakan coba lagi.');
    }
}

document.getElementById('teacherPassword').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') verifyPassword();
});
document.getElementById('userName').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') document.getElementById('studentName').focus();
});
document.getElementById('studentName').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') document.getElementById('userComment').focus();
});
document.getElementById('userComment').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') submitComment();
});

document.getElementById('commentModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
document.getElementById('announcementModal').addEventListener('click', function(e) {
    if (e.target === this) closeAnnouncementModal();
});
    </script>
</body>
</html>
